name: Turso nightly

# Real-remote integration against a Turso/libSQL DB. Gated by repo secrets so it
# never runs on forks or PRs (avoids burning the remote quota); nightly + manual.
on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily
  workflow_dispatch:
    inputs:
      verification_scope:
        description: 'Full suite, receiver diagnostics, or the in-flight restart vector'
        type: choice
        default: full
        options:
          - full
          - receivers
          - restart

permissions:
  contents: read

concurrency:
  group: turso-verification-db
  cancel-in-progress: false

jobs:
  turso:
    name: real Turso integration
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'mqlitehq/mqlite' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: TestTurso* against dedicated verification database
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope == 'full' }}
        env:
          MQLITE_TEST_DB: ${{ secrets.MQLITE_TEST_DB }}
          MQLITE_TEST_DB_AUTH_TOKEN: ${{ secrets.MQLITE_TEST_DB_AUTH_TOKEN }}
          MQLITE_TEST_DB_RESET_CONFIRM: '1'
        run: |
          if [ -z "$MQLITE_TEST_DB" ]; then
            echo "MQLITE_TEST_DB is required for the dedicated nightly integration suite."
            exit 1
          fi
          if [ -z "$MQLITE_TEST_DB_AUTH_TOKEN" ]; then
            echo "MQLITE_TEST_DB_AUTH_TOKEN is required when MQLITE_TEST_DB is configured."
            exit 1
          fi
          if [ "$MQLITE_TEST_DB" != "libsql://mqlite-verify-jiba.aws-ap-northeast-1.turso.io" ]; then
            echo "MQLITE_TEST_DB is not the dedicated verification database."
            exit 1
          fi
          go test ./engine/ -run TestTurso -count=1 -v -timeout 300s
      - name: HTTP broker and managed SDK against dedicated verification database
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope == 'full' }}
        env:
          MQLITE_TEST_DB: ${{ secrets.MQLITE_TEST_DB }}
          MQLITE_TEST_DB_AUTH_TOKEN: ${{ secrets.MQLITE_TEST_DB_AUTH_TOKEN }}
        run: |
          if [ -z "$MQLITE_TEST_DB" ] || [ -z "$MQLITE_TEST_DB_AUTH_TOKEN" ]; then
            echo "The dedicated verification database and token are required."
            exit 1
          fi
          if [ "$MQLITE_TEST_DB" != "libsql://mqlite-verify-jiba.aws-ap-northeast-1.turso.io" ]; then
            echo "MQLITE_TEST_DB is not the dedicated verification database."
            exit 1
          fi
          # Root package only: this case never invokes engine.TestMain's table reset.
          go test . -run '^TestTursoHTTPBrokerDelivery$' -count=1 -v -timeout 180s
      - name: Check out the independent remote SDK candidate
        id: remote-sdk-candidate
        uses: actions/checkout@v7
        with:
          repository: mqlitehq/mqlite-go
          ref: 4cb6c799a5c0099bb485921e489f7b55e7e7f3a9
          path: .test-mqlite-go
          persist-credentials: false
      - name: Independent remote SDK through HTTP against dedicated verification database
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'restart' }}
        working-directory: test/sdkcheck/remotesdk
        env:
          MQLITE_TEST_DB: ${{ secrets.MQLITE_TEST_DB }}
          MQLITE_TEST_DB_AUTH_TOKEN: ${{ secrets.MQLITE_TEST_DB_AUTH_TOKEN }}
          GOWORK: 'off'
        run: |
          if [ -z "$MQLITE_TEST_DB" ] || [ -z "$MQLITE_TEST_DB_AUTH_TOKEN" ]; then
            echo "The dedicated verification database and token are required."
            exit 1
          fi
          if [ "$MQLITE_TEST_DB" != "libsql://mqlite-verify-jiba.aws-ap-northeast-1.turso.io" ]; then
            echo "MQLITE_TEST_DB is not the dedicated verification database."
            exit 1
          fi
          if [ "$(git -C "$GITHUB_WORKSPACE/.test-mqlite-go" rev-parse HEAD)" != "4cb6c799a5c0099bb485921e489f7b55e7e7f3a9" ]; then
            echo "The remote SDK checkout does not match the reviewed candidate."
            exit 1
          fi
          go mod edit -replace=github.com/mqlitehq/mqlite-go="$GITHUB_WORKSPACE/.test-mqlite-go"
          # Separate module: no main-module SDK dependency and no engine.TestMain reset.
          go test . -run '^TestTursoHTTPBrokerDelivery$' -count=1 -v -timeout 180s
      - name: In-flight handlers survive broker close and reopen with both SDKs
        if: ${{ !cancelled() && steps.remote-sdk-candidate.outcome == 'success' }}
        working-directory: test/sdkcheck/remotesdk
        env:
          MQLITE_TEST_DB: ${{ secrets.MQLITE_TEST_DB }}
          MQLITE_TEST_DB_AUTH_TOKEN: ${{ secrets.MQLITE_TEST_DB_AUTH_TOKEN }}
          GOWORK: 'off'
        run: |
          # Test repeats the exact allowlist check; same shared database lock.
          # Run even if the earlier pipeline fails, preserving that failure.
          # Recheck independently instead of assuming earlier setup succeeded.
          if [ "$(git -C "$GITHUB_WORKSPACE/.test-mqlite-go" rev-parse HEAD)" != "4cb6c799a5c0099bb485921e489f7b55e7e7f3a9" ]; then
            echo "The remote SDK checkout does not match the reviewed candidate."
            exit 1
          fi
          go mod edit -replace=github.com/mqlitehq/mqlite-go="$GITHUB_WORKSPACE/.test-mqlite-go"
          go test -race . -run '^TestTursoInFlightBrokerRestart$' -count=1 -v -timeout 210s
