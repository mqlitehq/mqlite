name: Turso network diagnostic

# Test-only candidate: profile the existing product without resetting the DB.
# Shares the production-test lock with nightly/soak; never deploys a public app.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turso-verification-db
  cancel-in-progress: false

jobs:
  turso:
    name: bounded dedicated-Turso network profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.repository == 'mqlitehq/mqlite' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Verify diagnostic privacy and observation controls
        run: go test -race -count=1 -timeout 90s ./test/networkprobe
      - name: Profile dedicated verification database without reset
        env:
          MQLITE_TEST_DB: ${{ secrets.MQLITE_TEST_DB }}
          MQLITE_TEST_DB_AUTH_TOKEN: ${{ secrets.MQLITE_TEST_DB_AUTH_TOKEN }}
          MQLITE_NETWORK_PROBE_OUTPUT: ${{ runner.temp }}/network-probe/result.json
        run: |
          if [ -z "$MQLITE_TEST_DB" ]; then
            echo "MQLITE_TEST_DB is required for the dedicated nightly integration suite."
            exit 1
          fi
          if [ -z "$MQLITE_TEST_DB_AUTH_TOKEN" ]; then
            echo "MQLITE_TEST_DB_AUTH_TOKEN is required when MQLITE_TEST_DB is configured."
            exit 1
          fi
          if [ "$MQLITE_TEST_DB" != "libsql://mqlite-verify-jiba.aws-ap-northeast-1.turso.io" ]; then
            echo "MQLITE_TEST_DB is not the dedicated verification database."
            exit 1
          fi
          timeout 360s go run ./test/networkprobe --opens=2 --call-timeout=90s
      - name: Retain bounded privacy-safe measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turso-network-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-probe/result.json
          if-no-files-found: error
          retention-days: 14
