name: Final M194 stronger Receive loopback qualification

on:
  push:
    branches: [diagnostic/m194-m198-loopback-linux]

permissions:
  contents: read

jobs:
  qualification:
    name: fixed Receive comparison and two 180-second workloads
    if: github.repository == 'mqlitehq/mqlite'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
      M194_BUNDLE_SHA256: af1530dfc65b35aa834ccf2bf95a17a5b381108965cf017ec0ff0c17811a3586
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache-dependency-path: test/m194-final-qualification/harness/go.sum
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mqlitehq/mqlite-go
          ref: 68b087de54537b12e182d0c202b27c4da1fa187c
          fetch-depth: 0
          path: .diagnostic-sdk
          persist-credentials: false
      - name: Verify frozen inputs and controller controls
        run: |
          python3 -B test/m194-final-qualification/verify-bundle.py
          python3 -B test/m194-final-qualification/harness/supervisor_test.py
          python3 -B test/m194-final-qualification/remote_audit_test.py
      - name: Record declared execution environment
        run: |
          python3 -B - <<'PYENV' > "$RUNNER_TEMP/m194-final-environment.json"
          import json,os,platform,subprocess
          print(json.dumps({"platform":platform.platform(),"machine":platform.machine(),"cpu_count":os.cpu_count(),"runner_os":os.environ.get("RUNNER_OS"),"runner_arch":os.environ.get("RUNNER_ARCH"),"image_os":os.environ.get("ImageOS"),"image_version":os.environ.get("ImageVersion"),"go_version":subprocess.check_output(["go","version"],text=True).strip()},indent=2))
          PYENV
      - name: Run the fixed loopback comparison
        run: |
          python3 -B test/m194-final-qualification/run.py --main-repo "$GITHUB_WORKSPACE" --sdk-repo "$GITHUB_WORKSPACE/.diagnostic-sdk" --out "$RUNNER_TEMP/m194-m198-loopback-linux"
      - name: Verify inputs after execution
        if: always()
        run: python3 -B test/m194-final-qualification/verify-bundle.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: m194-m198-loopback-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m194-m198-loopback-linux/
            ${{ runner.temp }}/m194-final-environment.json
          if-no-files-found: error
          retention-days: 14
