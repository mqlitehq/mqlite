name: release image

# Manual backfills resolve an existing tag and build its exact commit. They never
# relabel the dispatch branch as an older release. RCs publish only their full tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag, e.g. v0.3.0 or v0.3.0-rc.1'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  ghcr:
    name: verify + publish multi-arch image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: verify release tag and complete CI
        id: release
        run: python3 .github/scripts/release_guard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
      - name: verify build checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: install OCI copy tool
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y skopeo
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      # Build once. Every subsequent scan, smoke and publish uses this exact archive.
      - name: build candidate (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache-filters: runtime
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/mqlite-image.oci.tar
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ steps.release.outputs.sha }}
      - name: scan and run both actual candidate platforms
        run: |
          python3 .github/scripts/image_candidate.py verify \
            --archive "$RUNNER_TEMP/mqlite-image.oci.tar" --output "$RUNNER_TEMP/mqlite-image-checks" \
            --version "$RELEASE_VERSION" --revision "$RELEASE_SHA"
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
      - name: log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish the verified OCI archive without rebuilding
        run: |
          python3 .github/scripts/image_candidate.py publish \
            --archive "$RUNNER_TEMP/mqlite-image.oci.tar" --output "$RUNNER_TEMP/mqlite-image-checks" \
            --version "$RELEASE_VERSION" --revision "$RELEASE_SHA" --tags "$RELEASE_IMAGE_TAGS"
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_IMAGE_TAGS: ${{ steps.release.outputs.image_tags }}
      - name: upload candidate verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-image-verification
          path: |
            ${{ runner.temp }}/mqlite-image-checks/*.json
            ${{ runner.temp }}/mqlite-image-checks/*.log
