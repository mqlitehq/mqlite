name: release image

# Manual backfills resolve an existing tag and build its exact commit. They never
# relabel the dispatch branch as an older release. RCs publish only their full tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag, e.g. v0.3.0 or v0.3.0-rc.1'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  ghcr:
    name: build + push multi-arch image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: verify release tag and complete CI
        id: release
        run: python3 .github/scripts/release_guard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
      - name: verify build checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - name: log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile cross-compiles and scans each actual binary before COPY.
      - name: build + push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache-filters: runtime
          push: true
          tags: ${{ steps.release.outputs.image_tags }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ steps.release.outputs.sha }}
