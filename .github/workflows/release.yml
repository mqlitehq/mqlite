name: release

# Publishing requires explicit maintainer approval to create the tag. Both release
# workflows verify the tag's source and the same complete CI run before building.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: verify release tag and complete CI
        id: release
        run: python3 .github/scripts/release_guard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
      - name: verify build checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the approved tag even when an RC and stable tag share a commit.
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}
