name: Diagnose preserved Windows Go1.21 WAL smoke failure
on:
  push:
    branches: [diagnostic/m194-windows-smoke]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'mqlitehq/mqlite'
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      M194_WINDOWS_DIAG_BUNDLE_SHA256: 39acd10dd3d64dfbb7cfc40e4aa2522f24c98c4b91c904c39b3ce8d6b5bc79d8
    steps:
      - name: Preserve canonical LF checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.21.x'
          cache-dependency-path: go.sum
      - name: Run declared twenty smoke repetitions with first-failure stop
        run: python -B test/m194-windows-smoke/run.py --output "$env:RUNNER_TEMP/m194-windows-smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: m194-windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m194-windows-smoke/
          if-no-files-found: error
          retention-days: 14
