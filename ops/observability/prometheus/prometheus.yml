global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/demo-rules.yml

scrape_configs:
  - job_name: mqlite
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/monitor_token
    static_configs:
      - targets: ["mqlite:9091"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
